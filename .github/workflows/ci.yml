# META(%%): the `yaml-lint` job is language-neutral — keep it verbatim. In the
# `test` job, replace the toolchain-setup / build / test steps with your language's
# (setup-dotnet, dtolnay/rust-toolchain, setup-java + gradle, …). Keep the matrix,
# the SHA-pinned-action convention, and the comment style. See META-AUTHORING.md.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'

      - name: Install yamllint
        run: pip install yamllint

      # Config is .yamllint.yml — tuned for Actions YAML. Real defects (tabs,
      # duplicate keys, bad indentation) fail; cosmetic line-length stays a
      # non-failing warning.
      - name: Lint YAML
        run: yamllint .

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Run every step through bash on all three OSes so build commands (e.g.
    # ./gradlew, $-expansions) behave the same everywhere. Drop this for a
    # toolchain that prefers the native shell.
    defaults:
      run:
        shell: bash
    steps:
      # Actions are pinned to a full commit SHA (supply-chain hardening); the
      # trailing comment records the human-readable version. Dependabot bumps the
      # SHA and updates the comment on its weekly run.
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # META(%%): set up the %%LangName%% toolchain here, pinned to a SHA. Examples:
      #   .NET    → actions/setup-dotnet  (dotnet-version: '10.0.x')
      #   Rust    → dtolnay/rust-toolchain@stable  (+ Swatinem/rust-cache)
      #   Kotlin  → actions/setup-java (temurin, 25) + gradle/actions/setup-gradle
      # Add dependency caching keyed on your lock/manifest files where it helps.
      - name: Set up %%LangName%% toolchain
        run: |
          echo "TODO(meta): install the %%BuildTool%% toolchain (see META-AUTHORING.md)"
          exit 1

      - name: Build
        run: |
          %%BuildCmd%%

      - name: Test
        run: |
          %%TestCmd%%
